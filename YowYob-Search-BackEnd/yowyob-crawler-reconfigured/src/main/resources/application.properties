# ===================================================================
# Configuration du Crawler Service
# ===================================================================

# Server Configuration
server.port=8091

# Application Name
spring.application.name=crawler-service

# ===================================================================
# H2 DataSource Configuration (Embedded Database)
# ===================================================================
spring.datasource.url=jdbc:h2:mem:crawler_db
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console (optional)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ===================================================================
# JPA/Hibernate Configuration
# ===================================================================
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# ===================================================================
# Redis Configuration
# ===================================================================
spring.data.redis.host=${SPRING_REDIS_HOST:127.0.0.1}
spring.data.redis.port=${SPRING_REDIS_PORT:6379}
spring.data.redis.password=${SPRING_REDIS_PASSWORD:}
spring.data.redis.ssl.enabled=false

# ===================================================================
# Elasticsearch Configuration
# ===================================================================
spring.elasticsearch.uris=${SPRING_ELASTICSEARCH_URIS:http://localhost:9200}
elasticsearch.host=${ELASTICSEARCH_HOST:localhost}
elasticsearch.port=${ELASTICSEARCH_PORT:9200}
elasticsearch.index.name=crawler-index
elasticsearch.bulk.size=100

# ===================================================================
# Service Connectors Configuration
# ===================================================================
service.listing.api.url=${LISTING_SERVICE_URL:http://localhost:8083/api/listings}
service.listing.enabled=true

service.user.api.url=${USER_SERVICE_API_URL:http://localhost:8084/api/users}
service.user.api.key=${USER_SERVICE_API_KEY:}
service.user.enabled=true

service.businessbook.api.url=${BUSINESSBOOK_SERVICE_URL:https://businessbookr-production.up.railway.app/api/businessbook/search/documents}
service.businessbook.enabled=true

# ===================================================================
# Kafka Configuration
# ===================================================================
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=crawler-service-group
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.properties.spring.json.value.default.type=com.yowyob.auth.event.UserCreatedEvent

# ===================================================================
# RabbitMQ Configuration
# ===================================================================
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

# Crawler Scheduler Configuration
crawler.scheduler.enabled=true
crawler.scheduler.fixed-rate=300000
crawler.scheduler.initial-delay=15000

# JWT Configuration
jwt.secret=yowyob-super-secret-key-change-this-in-production-minimum-256-bits
jwt.expiration=3600000

# Jackson Configuration — désactivé car incompatible avec Spring Boot 4 JacksonProperties
# spring.jackson.serialization.write-dates-as-timestamps=false

# ===================================================================
# Scraper Sources Configuration
# ===================================================================

# --- Source 1: OLX Cameroun ---
# OLX renders via JavaScript (client-side) — Jsoup cannot parse its listings.
# Disabled real scraping; fallback data will be used.
scraper.olx.url=https://www.olx.cm/
scraper.olx.enabled=false

# --- Source 2: Annuaire GoAfrica (local businesses) ---
scraper.directory.cm.enabled=true

# --- Source 3: Jeema.cm ---
# Jeema.cm is unreachable (connection timeout). Disabled.
scraper.jeema.url=https://www.jeema.cm/annonces
scraper.jeema.enabled=false

# --- Source 4: CoinAfrique Cameroun ---
scraper.coinafrique.url=https://cm.coinafrique.com
scraper.coinafrique.enabled=true

# --- Source 5: Expat-Dakar Cameroun ---
# Returns HTTP 403 Forbidden — bot protection active. Disabled.
scraper.expatdakar.url=https://www.expat-dakar.com/cameroun
scraper.expatdakar.enabled=false

# --- Source 6: OpenStreetMap Overpass (real GPS businesses) ---
scraper.osm.enabled=true
